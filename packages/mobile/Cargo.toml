[package]
name = "veyvox-mobile"
version = "1.17.18"
edition = "2021"
description = "Veyvox Android client preview — native Rust UI inspired by the web MobileShell"
license = "AGPL-3.0-only"
repository = "https://github.com/bernardokcosta/veyvox"

[lib]
name = "veyvox_mobile"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "veyvox-mobile"
path = "src/main.rs"

[dependencies]
# All direct dependencies are permissive (MIT / Apache-2.0 / ISC / BSD),
# arm's-length only. Never add strong-copyleft or source-available
# licenses here: see AGENTS.md.
egui = "0.32"
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "android-native-activity"] }
winit = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }

[target.'cfg(target_os = "android")'.dependencies]
log = "0.4"
android_logger = "0.15"

[profile.release]
opt-level = "s"
panic = "abort"
strip = true

# Android packaging metadata (cargo-apk / ndk-build read this; plain
# `cargo build` / `cargo test` / `cargo check` ignore unknown metadata).
[package.metadata.android]
package = "io.github.bernardokcosta.veyvox"
# One universal APK: arm64 phones, legacy 32-bit ARM, and the x86_64
# emulator the CI smoke test boots. Keep x86_64: dropping it breaks the
# install-and-open gate in mobile-android.yml.
build_targets = ["aarch64-linux-android", "armv7-linux-androideabi", "x86_64-linux-android"]
strip = "strip"

# Release signing comes from the environment, never from a committed file:
# CARGO_APK_RELEASE_KEYSTORE / CARGO_APK_RELEASE_KEYSTORE_PASSWORD.
# CI generates an ephemeral keystore only for non-tag builds; tag builds
# fail closed when the dedicated secrets are absent. See mobile-android.yml.

# Path to your application's resources folder, relative to this Cargo.toml.
# Packaged as the APK's `res/` overlay (e.g. the launcher drawable below).
resources = "android/res"
assets = "assets"

# See https://developer.android.com/guide/topics/manifest/uses-sdk-element
[package.metadata.android.sdk]
min_sdk_version = 28
target_sdk_version = 34

# INTERNET is load-bearing: every screen reads from the instance over
# HTTPS/WSS. ACCESS_NETWORK_STATE lets the app report offline instead of
# timing out every request.
[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_NETWORK_STATE"

# See https://developer.android.com/guide/topics/manifest/application-element
[package.metadata.android.application]
label = "Veyvox"
icon = "@drawable/ic_launcher"
